# Task 0050: a v* tag tests, smoke-tests the packed tarball, publishes to npm with provenance and deploys the docs site.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - run: npm run pack:smoke
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - run: npm install -g npm@latest # trusted publishing (OIDC) needs npm 11.5.1+, staging a newer one
      # The trusted publisher only allows staging: approve with 2FA via `npm stage list decisium` + `npm stage approve <id>`.
      - run: npm stage publish --access public
      - run: npm pack --silent && gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes decisium-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
  pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/site.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
