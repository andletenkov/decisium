# Task 0050: a v* tag tests, smoke-tests the packed tarball, stages the npm release (provenance) and creates the GitHub release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5 # fail fast when the runner's apt/CDN download hangs
      - run: npm run typecheck
      - run: npm test
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - run: npm run pack:smoke
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - run: npm install -g npm@latest # trusted publishing (OIDC) needs npm 11.5.1+, staging a newer one
      # The trusted publisher only allows staging: approve with 2FA via `npm stage list decisium` + `npm stage approve <id>`.
      - run: npm stage publish --access public
      - run: npm pack --silent && gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes decisium-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
