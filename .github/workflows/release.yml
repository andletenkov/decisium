# Task 0050: a v* tag tests, smoke-tests the packed tarball, stages the npm release (provenance) and creates the GitHub release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the ancestry check below needs main's history, not just the tag
      # A tag can point at any commit, including one that never passed CI or review.
      # Only main is branch-protected, so refuse to publish anything not merged into it.
      - name: Verify the tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main - tag a merged commit"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 15 # fail fast when the runner's apt/CDN download hangs; 5 was too tight for slow Azure mirrors
      - run: npm run typecheck
      - run: npm test
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - run: npm run pack:smoke
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - run: npm install -g npm@latest # trusted publishing (OIDC) needs npm 11.5.1+, staging a newer one
      # The trusted publisher only allows staging: approve with 2FA via `npm stage list decisium` + `npm stage approve <id>`.
      - run: npm stage publish --access public
      - run: npm pack --silent && gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes decisium-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
