# Called by release-please.yml once its release PR is merged: tests the tag, smoke-tests the packed tarball, stages the npm release (provenance) and attaches the tarball to the GitHub release release-please created. Then pushes the runner image to ghcr.io.
name: release
on:
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag release-please created
        required: true
        type: string
    secrets:
      TYPESAFE_API_KEY:
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # the ancestry check below needs main's history, not just the tag
      # A tag can point at any commit, including one that never passed CI or review.
      # Only main is branch-protected, so refuse to publish anything not merged into it.
      - name: Verify the tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not on main - tag a merged commit"; exit 1; }
        env:
          TAG: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 15 # fail fast when the runner's apt/CDN download hangs; 5 was too tight for slow Azure mirrors
      - run: npm run typecheck
      - run: npm test
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - run: npm run pack:smoke
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - uses: docker/setup-buildx-action@v3
      - name: Build the runner image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: decisium:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test - Chromium launches in the image
        run: docker run --rm -w /opt/decisium --entrypoint node decisium:smoke -e "require('playwright').chromium.launch().then(b=>b.close())"
      - run: npm install -g npm@latest # trusted publishing (OIDC) needs npm 11.5.1+, staging a newer one
      # The trusted publisher only allows staging: approve with 2FA via `npm stage list decisium` + `npm stage approve <id>`.
      - run: npm stage publish --access public
      - run: npm pack --silent && gh release upload "$TAG" decisium-*.tgz
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
  image: # multi-arch push; the amd64 image was built and smoke-tested in publish (cache hit)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
