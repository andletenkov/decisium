# Lint/format, audit, typecheck, tests, the docs build, the packed-tarball and Docker image smoke tests, and the replay
# speed bench on every push to main and every PR.
# No secrets: the suite runs without TYPESAFE_API_KEY (the one live test skips) and the smoke test checks install + bin.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Issue #90: in 0.5.0 a behaviour change re-recorded every fixture cassette, so the suite compared the new version
  # with itself. A PR that changes src/ and a cassette in test/ needs the re-record-approved label; frozen release
  # cassettes (test/fixtures/compat) never change.
  cassette-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 're-record-approved') }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          # A new release's directory may be added; an existing one is never modified, renamed or deleted.
          if git diff --name-only --diff-filter=MDR "$BASE"...HEAD | grep -q '^test/fixtures/compat/'; then
            echo "::error::test/fixtures/compat holds cassettes of released versions; they are never changed"; exit 1
          fi
          if echo "$changed" | grep -q '^src/' && echo "$changed" | grep -q '^test/.*\.cassette\.json$' && [ "$APPROVED" != true ]; then
            echo "::error::this PR changes src/ and re-records test cassettes; add the re-record-approved label if that is intended"; exit 1
          fi
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 15 # fail fast when the runner's apt/CDN download hangs; 5 was too tight for slow Azure mirrors
      - run: npm run typecheck
      - run: npm run test:coverage # fails under 85% lines/branches/functions of src/
      - run: node scripts/site.ts && git diff --exit-code site/ # committed site/ matches the markdown
      - run: npm run pack:smoke
  # Cassette replay against a hand-written Playwright script on a fresh runner (issue #2): a ratio, so a slow runner
  # slows both. Fails over 1.5x; about 1.35x on GitHub runners (1.2x locally). Its own job: after the test suite on the
  # same runner it measured 1.65x.
  replay-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 15
      - run: node scripts/replay-bench.ts --runs 5 | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash # bash -eo pipefail; the default bash -e loses the bench's exit code in the pipe
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the runner image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: decisium:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test - Chromium launches in the image
        run: docker run --rm -w /opt/decisium --entrypoint node decisium:smoke -e "require('playwright').chromium.launch().then(b=>b.close())"
