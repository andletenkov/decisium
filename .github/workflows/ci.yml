# Lint/format, audit, typecheck, tests, the docs build, the packed-tarball and Docker image smoke tests on every push to
# main and every PR.
# No secrets: the suite runs without TYPESAFE_API_KEY (the one live test skips) and the smoke test checks install + bin.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 15 # fail fast when the runner's apt/CDN download hangs; 5 was too tight for slow Azure mirrors
      - run: npm run typecheck
      - run: npm run test:coverage # fails under 85% lines/branches/functions of src/
      - run: node scripts/site.ts && git diff --exit-code site/ # committed site/ matches the markdown
      - run: npm run pack:smoke
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the runner image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: decisium:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test - Chromium launches in the image
        run: docker run --rm -w /opt/decisium --entrypoint node decisium:smoke -e "require('playwright').chromium.launch().then(b=>b.close())"
