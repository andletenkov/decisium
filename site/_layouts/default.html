<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/nocturne.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<nav class="site-nav">
  <a class="brand" href="{{ '/' | relative_url }}">{% include mark.html size=26 %}{% include wordmark.html %}</a>
  <div class="links">
    <a href="{{ '/readme.html' | relative_url }}"{% if page.url == '/readme.html' %} aria-current="page"{% endif %}>Get started</a>
    <a href="{{ '/docs/configuration.html' | relative_url }}"{% if page.url == '/docs/configuration.html' %} aria-current="page"{% endif %}>Configuration</a>
    <a href="{{ '/docs/cookbook.html' | relative_url }}"{% if page.url == '/docs/cookbook.html' %} aria-current="page"{% endif %}>Cookbook</a>
    <a href="https://www.npmjs.com/package/decisium">npm</a>
  </div>
</nav>
<main class="page">
{% if page.landing %}{{ content }}{% else %}<article class="doc">{{ content }}</article>{% endif %}
</main>
<footer>{% include mark.html size=16 %}<span>MIT · From behavioral specification to intelligent execution.</span></footer>
</body>
</html>
