<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campaigns</title>
<style>
  body { font-family: sans-serif; max-width: 32rem; margin: 2rem auto; }
  label, .field { display: block; margin: 1rem 0; }
  [hidden] { display: none !important; }
  [role=listbox] { border: 1px solid #888; list-style: none; padding: 0; margin: 0; }
  [role=option] { padding: .25rem .5rem; cursor: pointer; }
  [role=option][aria-selected=true] { background: #def; }
</style>
</head>
<body>
<h1>New campaign</h1>
<!-- ?dropdown=custom swaps the native select for an ARIA combobox/listbox -->
<form id="form" onsubmit="return false">
  <label>Campaign name <input id="name" type="text"></label>
  <div class="field" id="period-field"></div>
  <button id="schedule" type="button">Schedule</button>
  <button type="button">Save draft</button>
</form>
<p>Status: <span id="status">Draft</span></p>
<!-- ?decoy=1 adds an unrelated element saying "Scheduled": assertions must pick the status by meaning, not by text -->
<label id="decoy" hidden>Show campaigns <select><option>All</option><option>Scheduled</option></select></label>

<script>
  const PERIODS = ["1 week", "2 weeks", "3 weeks"];
  const field = document.getElementById("period-field");
  const params = new URLSearchParams(location.search);
  const custom = params.get("dropdown") === "custom";
  if (params.get("decoy")) {
    const decoy = document.getElementById("decoy");
    decoy.hidden = false;
    decoy.querySelector("select").value = "Scheduled";
  }

  if (!custom) {
    field.innerHTML = `<label>Activation period <select id="period">${PERIODS.map(p => `<option>${p}</option>`).join("")}</select></label>`;
  } else {
    field.innerHTML = `
      <span id="period-label">Activation period</span>
      <div id="period" role="combobox" tabindex="0" aria-labelledby="period-label" aria-expanded="false" aria-controls="period-list">${PERIODS[0]}</div>
      <ul id="period-list" role="listbox" aria-labelledby="period-label" hidden>
        ${PERIODS.map(p => `<li role="option" aria-selected="${p === PERIODS[0]}">${p}</li>`).join("")}
      </ul>`;
    const box = document.getElementById("period");
    const list = document.getElementById("period-list");
    const toggle = open => { list.hidden = !open; box.setAttribute("aria-expanded", String(open)); };
    box.addEventListener("click", () => toggle(list.hidden));
    list.addEventListener("click", e => {
      const opt = e.target.closest("[role=option]");
      if (!opt) return;
      list.querySelectorAll("[role=option]").forEach(o => o.setAttribute("aria-selected", String(o === opt)));
      box.textContent = opt.textContent;
      toggle(false);
    });
  }

  // ?slow=1: the status updates 1.2 s after the click, with no request (timer), so only retrying sees it.
  const delay = params.get("slow") ? 1200 : 0;
  document.getElementById("schedule").addEventListener("click", () => {
    const name = document.getElementById("name").value.trim();
    setTimeout(() => { document.getElementById("status").textContent = name ? "Scheduled" : "Name required"; }, delay);
  });
</script>
</body>
</html>
