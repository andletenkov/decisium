<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Cookbook lab</title></head>
<!-- Fixture for docs/cookbook.md (task 0031): an article search, settings with labelled and unlabelled checkboxes,
     (?contacts, task 0038) a contact form and table for data tables and doc strings, and (?keys, task 0039) a page
     driven by keys: Escape closes the help, Ctrl+K opens the command palette, arrows move through a list. -->
<body>
<nav aria-label="Main"><a href="#" id="to-search">Search</a> <a href="#" id="to-settings">Settings</a></nav>
<main id="main"></main>
<script>
const main = document.getElementById("main");
const ARTICLES = { "Ada Lovelace": "Ada Lovelace (born 10 December 1815) was an English mathematician.",
  "Ada (programming language)": "Ada is a programming language named after Ada Lovelace.",
  "Charles Babbage": "Charles Babbage designed the Analytical Engine." };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function search() {
  main.innerHTML = `<h1>Search</h1>
    <form id="form" role="search"><label>Search articles <input id="q"></label> <button>Search</button></form>
    <section aria-label="Results"></section>`;
  document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    const q = document.getElementById("q").value.toLowerCase();
    const hits = Object.keys(ARTICLES).filter(t => ARTICLES[t].toLowerCase().includes(q) || t.toLowerCase().includes(q));
    main.querySelector("section").innerHTML = `<h2>Results</h2>` + (hits.length
      ? `<ul>${hits.map(t => `<li><a href="#" data-title="${esc(t)}">${esc(t)}</a></li>`).join("")}</ul>`
      : `<p>No results</p>`);
    main.querySelectorAll("a[data-title]").forEach(a => a.onclick = e => { e.preventDefault(); article(a.dataset.title); });
  };
}

function article(title) {
  main.innerHTML = `<h1>${esc(title)}</h1><p>${esc(ARTICLES[title])}</p>`;
}

function settings() {
  // Two checkboxes the way the-internet.herokuapp.com/checkboxes draws them: no label, text beside them.
  main.innerHTML = `<h1>Settings</h1>
    <form><input type="checkbox"> checkbox 1<br><input type="checkbox" checked> checkbox 2</form>
    <h2>Notifications</h2>
    <label><input type="checkbox"> Weekly digest</label><br><label><input type="checkbox" checked> Newsletter</label>`;
}

function contacts() {
  const rows = [["Charles", "Babbage", "Inventor"]];
  main.innerHTML = `<h1>Contacts</h1>
    <form aria-label="New contact"><label>First name <input name="first"></label> <label>Last name <input name="last"></label>
      <fieldset><legend>Roles</legend><label><input type="checkbox" value="Mathematician"> Mathematician</label>
        <label><input type="checkbox" value="Inventor"> Inventor</label></fieldset>
      <label>Notes <textarea name="notes"></textarea></label> <button>Add contact</button></form>
    <p role="status"></p>
    <table aria-label="Contacts"><thead><tr><th>First name</th><th>Last name</th><th>Roles</th></tr></thead><tbody></tbody></table>`;
  const form = main.querySelector("form");
  const draw = () => main.querySelector("tbody").innerHTML = rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("");
  form.onsubmit = e => {
    e.preventDefault();
    const roles = [...form.querySelectorAll(":checked")].map(c => c.value).join(", ");
    rows.push([form.first.value, form.last.value, roles]);
    form.reset();
    main.querySelector("[role=status]").textContent = `Contact ${rows.at(-1)[0]} ${rows.at(-1)[1]} added`;
    draw();
  };
  draw();
}

function keys() {
  main.innerHTML = `<h1>Keys</h1>
    <button id="help">Keyboard help</button>
    <div role="dialog" aria-label="Keyboard help" hidden><p>Close it with Escape.</p></div>
    <div role="dialog" aria-label="Command palette" hidden><h2>Commands</h2><ul><li>Go to settings</li><li>Go to search</li></ul></div>
    <ul role="listbox" aria-label="Fruits" tabindex="0">${["Apple", "Banana", "Cherry"].map((f, i) =>
      `<li role="option" aria-selected="${i === 0}">${f}</li>`).join("")}</ul>
    <label>Note <input></label>
    <p role="status"></p>`;
  const [help, palette] = main.querySelectorAll("[role=dialog]");
  const list = main.querySelector("[role=listbox]");
  document.getElementById("help").onclick = () => { help.hidden = false; };
  // The focused control, so a check can read where Tab moved it.
  main.addEventListener("focusin", e => { main.querySelector("[role=status]").textContent = `Focus: ${e.target.getAttribute("aria-label") ?? e.target.closest("label")?.textContent.trim() ?? e.target.textContent}`; });
  list.onkeydown = e => {
    const opts = [...list.children], at = opts.findIndex(o => o.getAttribute("aria-selected") === "true");
    const to = e.key === "ArrowDown" ? Math.min(at + 1, opts.length - 1) : e.key === "ArrowUp" ? Math.max(at - 1, 0) : at;
    opts.forEach((o, i) => o.setAttribute("aria-selected", String(i === to)));
  };
  document.onkeydown = e => {
    if (e.key === "Escape") help.hidden = palette.hidden = true;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palette.hidden = false; }
  };
  list.focus();
}

document.getElementById("to-search").onclick = e => { e.preventDefault(); search(); };
document.getElementById("to-settings").onclick = e => { e.preventDefault(); settings(); };
location.search.includes("settings") ? settings() : location.search.includes("contacts") ? contacts()
  : location.search.includes("keys") ? keys() : search();
</script>
</body>
</html>
